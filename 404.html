<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vedha Live Photography</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0b0a;color:#f6f1e7;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  h1{color:#f0d896;font-weight:600;font-size:22px;margin:18px 0 8px}
  p{color:#a39b8f;margin:0 auto;max-width:340px;line-height:1.5;font-size:15px}
  .spin{width:34px;height:34px;margin:0 auto;border-radius:50%;border:3px solid rgba(240,216,150,.18);
    border-top-color:#f0d896;animation:s .9s linear infinite}
  .spin[hidden]{display:none}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div>
  <div class="spin" id="spin"></div>
  <h1>Vedha Live Photography</h1>
  <p id="msg">Opening your event's photos…</p>
</div>
<script>
// The fixed address on the QR codes. It looks up where the gallery is right now (link.json, kept
// up to date by the Vedha PC) and forwards the guest there. It waits and retries while the gallery
// is starting up, instead of showing "site can't be reached".
(function () {
  var msg = document.getElementById("msg");
  var path = location.pathname;
  var m = path.match(/\/g\/([A-Za-z0-9]{4,20})\/?$/);
  var code = m ? m[1] : new URLSearchParams(location.search).get("g");
  if (!code || !/^[A-Za-z0-9]{4,20}$/.test(code)) {
    document.getElementById("spin").hidden = true;
    msg.textContent = "Scan the QR code on your event card to open your event's photos.";
    return;
  }
  var root = m ? path.slice(0, path.length - m[0].length) + "/" : path.replace(/[^/]*$/, "");

  function get(url, ms) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl && setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, { cache: "no-store", signal: ctrl && ctrl.signal }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error(r.status);
      return r;
    });
  }

  var tries = 0;
  function attempt() {
    get(root + "link.json?t=" + Date.now(), 8000)
      .then(function (r) { return r.json(); })
      .then(function (link) {
        if (!link.url) throw new Error("no link");
        return get(link.url + "/alive?t=" + Date.now(), 8000).then(function () {
          location.replace(link.url + "/g/" + code);
        });
      })
      .catch(function () {
        tries += 1;
        if (tries >= 2) msg.textContent = "The gallery is starting up. It will open by itself in a moment…";
        setTimeout(attempt, tries < 6 ? 5000 : 15000);
      });
  }
  attempt();
})();
</script>
</body>
</html>
